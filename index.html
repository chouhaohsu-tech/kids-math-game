<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌟 Magic Math Adventure! Kids Addition & Subtraction 🎈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas for celebration fireworks & floating flowers -->
  <canvas id="fxCanvas"></canvas>

  <div class="game-container">
    <!-- Top Header & Controls -->
    <header class="game-header">
      <div class="logo-badge">
        <span class="logo-icon">🎈</span>
        <h1 class="game-title">Magic Math Fun!</h1>
        <span class="logo-icon">✨</span>
      </div>

      <div class="header-tools">
        <!-- Sound toggle -->
        <button id="soundBtn" class="tool-btn" title="Toggle Sound" aria-label="Toggle Sound">
          <span id="soundIcon">🔊</span>
        </button>
        <!-- Speech Read-Aloud button -->
        <button id="speechBtn" class="tool-btn" title="Read Problem Aloud" aria-label="Read Problem Aloud">
          <span>🗣️</span>
          <span class="btn-label">Read to Me</span>
        </button>
        <!-- Visual Helpers toggle -->
        <button id="visualToggleBtn" class="tool-btn active" title="Show/Hide Fruit Counters" aria-label="Toggle Counters">
          <span>🍎</span>
          <span class="btn-label">Counters</span>
        </button>
      </div>
    </header>

    <!-- Score & Streak Bar -->
    <div class="score-banner">
      <div class="streak-box">
        <span class="star-icon">⭐</span>
        <span class="streak-label">Score:</span>
        <span id="scoreVal" class="score-num">0</span>
      </div>
      <div class="stars-tray" id="starsTray">
        <span class="star-slot empty">⭐</span>
        <span class="star-slot empty">⭐</span>
        <span class="star-slot empty">⭐</span>
        <span class="star-slot empty">⭐</span>
        <span class="star-slot empty">⭐</span>
      </div>
      <div class="trophy-badge" id="trophyBadge" title="Collect 5 stars for a prize!">
        <span class="trophy-icon">🏆</span>
        <span id="trophyCount">0</span>
      </div>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="mode-selector">
      <button class="mode-tab active" data-mode="add">
        <span class="tab-icon">➕</span> Addition
      </button>
      <button class="mode-tab" data-mode="sub">
        <span class="tab-icon">➖</span> Subtraction
      </button>
      <button class="mode-tab" data-mode="mix">
        <span class="tab-icon">🔀</span> Both (+ & -)
      </button>
    </div>

    <!-- Main Game Board -->
    <main class="math-board">
      <!-- Equation Display with huge colorful fonts -->
      <div class="equation-card">
        <div class="num-box num-first" id="num1">9</div>
        <div class="op-box" id="opSymbol">+</div>
        <div class="num-box num-second" id="num2">8</div>
        <div class="eq-box">=</div>
        <div class="mystery-box" id="mysteryBox">?</div>
      </div>

      <!-- Visual Counting Counters (Interactive fruits/stars) -->
      <div class="visual-helpers-container" id="visualHelpers">
        <div class="helper-group helper-left" id="helperLeft"></div>
        <div class="helper-op" id="helperOp">+</div>
        <div class="helper-group helper-right" id="helperRight"></div>
      </div>

      <!-- Instruction / Hint Prompt -->
      <div class="hint-text" id="hintText">Tap the number keys, then press OK! 👇</div>

      <!-- Kid-Friendly Interactive Number Keypad -->
      <div class="keypad-container" id="keypad">
        <div class="keypad-grid">
          <button class="key-btn key-num" data-val="1">1</button>
          <button class="key-btn key-num" data-val="2">2</button>
          <button class="key-btn key-num" data-val="3">3</button>

          <button class="key-btn key-num" data-val="4">4</button>
          <button class="key-btn key-num" data-val="5">5</button>
          <button class="key-btn key-num" data-val="6">6</button>

          <button class="key-btn key-num" data-val="7">7</button>
          <button class="key-btn key-num" data-val="8">8</button>
          <button class="key-btn key-num" data-val="9">9</button>

          <button class="key-btn key-action key-clear" id="keyClear" title="Clear/Delete">⌫ Del</button>
          <button class="key-btn key-num" data-val="0">0</button>
          <button class="key-btn key-action key-submit" id="keySubmit" title="Check Answer">OK ✅</button>
        </div>
      </div>
    </main>

    <!-- Sticker Rewards Drawer -->
    <section class="sticker-shelf" id="stickerShelf">
      <div class="shelf-title">
        <span>🎁 My Sticker Album (<span id="stickerCount">0</span>/6)</span>
      </div>
      <div class="stickers-row" id="stickersRow">
        <div class="sticker-item locked" data-id="1">🦄</div>
        <div class="sticker-item locked" data-id="2">🚀</div>
        <div class="sticker-item locked" data-id="3">🦖</div>
        <div class="sticker-item locked" data-id="4">🌈</div>
        <div class="sticker-item locked" data-id="5">🍦</div>
        <div class="sticker-item locked" data-id="6">👑</div>
      </div>
    </section>
  </div>

  <!-- Celebration Modal (Fireworks, Flowers, Cheering Animals) -->
  <div class="modal-overlay" id="celebrationModal">
    <div class="celebration-card">
      <div class="celebration-ribbon">🌟 AWESOME! 🌟</div>
      
      <!-- Cheerful Animal Parade (SVG Animating) -->
      <div class="animal-stage">
        <!-- SVG Cheering Animals -->
        <div class="cheering-animal lion active" id="animalLion">
          <svg viewBox="0 0 200 200" width="160" height="160" class="svg-animal">
            <!-- Lion Mane -->
            <circle cx="100" cy="100" r="75" fill="#FFA726"/>
            <circle cx="100" cy="100" r="68" fill="#FF7043"/>
            <!-- Lion Ears -->
            <circle cx="60" cy="45" r="18" fill="#FF7043"/>
            <circle cx="60" cy="45" r="10" fill="#FFCC80"/>
            <circle cx="140" cy="45" r="18" fill="#FF7043"/>
            <circle cx="140" cy="45" r="10" fill="#FFCC80"/>
            <!-- Lion Face -->
            <circle cx="100" cy="105" r="52" fill="#FFCC80"/>
            <!-- Party Hat -->
            <polygon points="100,10 75,55 125,55" fill="#AB47BC"/>
            <circle cx="100" cy="10" r="8" fill="#FFEB3B"/>
            <circle cx="88" cy="40" r="4" fill="#FFEB3B"/>
            <circle cx="108" cy="35" r="5" fill="#29B6F6"/>
            <!-- Cheerful Eyes -->
            <path d="M 80 95 Q 88 85 96 95" stroke="#3E2723" stroke-width="5" stroke-linecap="round" fill="none"/>
            <path d="M 104 95 Q 112 85 120 95" stroke="#3E2723" stroke-width="5" stroke-linecap="round" fill="none"/>
            <!-- Rosy Cheeks -->
            <circle cx="75" cy="112" r="10" fill="#FF8A80" opacity="0.6"/>
            <circle cx="125" cy="112" r="10" fill="#FF8A80" opacity="0.6"/>
            <!-- Nose & Happy Big Open Smile -->
            <polygon points="100,110 93,103 107,103" fill="#D84315"/>
            <path d="M 100 110 L 100 118" stroke="#3E2723" stroke-width="3"/>
            <path d="M 88 118 Q 100 138 112 118 Z" fill="#D32F2F" stroke="#3E2723" stroke-width="3"/>
            <!-- Tongue -->
            <path d="M 94 126 Q 100 135 106 126 Z" fill="#FF8A80"/>
            <!-- Cheering Paws -->
            <g class="cheering-paws">
              <ellipse cx="40" cy="120" rx="18" ry="14" fill="#FFCC80" transform="rotate(-25 40 120)"/>
              <ellipse cx="160" cy="120" rx="18" ry="14" fill="#FFCC80" transform="rotate(25 160 120)"/>
            </g>
          </svg>
        </div>

        <div class="cheering-animal bunny" id="animalBunny">
          <svg viewBox="0 0 200 200" width="160" height="160" class="svg-animal">
            <!-- Bunny Ears -->
            <ellipse cx="70" cy="50" rx="16" ry="45" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="3" transform="rotate(-12 70 50)"/>
            <ellipse cx="70" cy="50" rx="8" ry="32" fill="#FF80AB" transform="rotate(-12 70 50)"/>
            <ellipse cx="130" cy="50" rx="16" ry="45" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="3" transform="rotate(12 130 50)"/>
            <ellipse cx="130" cy="50" rx="8" ry="32" fill="#FF80AB" transform="rotate(12 130 50)"/>
            <!-- Bunny Head -->
            <circle cx="100" cy="115" r="55" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="3"/>
            <!-- Cute Big Eyes -->
            <circle cx="82" cy="110" r="9" fill="#37474F"/>
            <circle cx="80" cy="107" r="3" fill="#FFFFFF"/>
            <circle cx="118" cy="110" r="9" fill="#37474F"/>
            <circle cx="116" cy="107" r="3" fill="#FFFFFF"/>
            <!-- Blushing Cheeks -->
            <circle cx="68" cy="125" r="10" fill="#FF80AB" opacity="0.6"/>
            <circle cx="132" cy="125" r="10" fill="#FF80AB" opacity="0.6"/>
            <!-- Cute Nose and Smile -->
            <ellipse cx="100" cy="118" rx="6" ry="4" fill="#FF4081"/>
            <path d="M 94 124 Q 100 130 106 124" stroke="#37474F" stroke-width="3" stroke-linecap="round" fill="none"/>
            <!-- Cheerful Golden Star in Hand -->
            <polygon points="100,140 106,155 122,156 109,166 114,182 100,172 86,182 91,166 78,156 94,155" fill="#FFD700"/>
          </svg>
        </div>

        <div class="cheering-animal puppy" id="animalPuppy">
          <svg viewBox="0 0 200 200" width="160" height="160" class="svg-animal">
            <!-- Puppy Ears -->
            <ellipse cx="50" cy="95" rx="20" ry="40" fill="#8D6E63" transform="rotate(25 50 95)"/>
            <ellipse cx="150" cy="95" rx="20" ry="40" fill="#8D6E63" transform="rotate(-25 150 95)"/>
            <!-- Puppy Head -->
            <circle cx="100" cy="105" r="54" fill="#D7CCC8"/>
            <!-- Eye Patch -->
            <ellipse cx="80" cy="95" rx="20" ry="18" fill="#8D6E63" opacity="0.7"/>
            <!-- Sparkly Happy Eyes -->
            <circle cx="80" cy="95" r="8" fill="#3E2723"/>
            <circle cx="78" cy="92" r="3" fill="#FFFFFF"/>
            <circle cx="120" cy="95" r="8" fill="#3E2723"/>
            <circle cx="118" cy="92" r="3" fill="#FFFFFF"/>
            <!-- Cheeks -->
            <circle cx="66" cy="115" r="8" fill="#FFAB91" opacity="0.7"/>
            <circle cx="134" cy="115" r="8" fill="#FFAB91" opacity="0.7"/>
            <!-- Snout & Big Happy Tongue -->
            <ellipse cx="100" cy="115" rx="16" ry="11" fill="#FFFFFF"/>
            <ellipse cx="100" cy="110" rx="9" ry="6" fill="#3E2723"/>
            <path d="M 96 118 Q 100 123 104 118" stroke="#3E2723" stroke-width="2" fill="none"/>
            <path d="M 95 120 C 95 136, 105 136, 105 120 Z" fill="#FF5252"/>
          </svg>
        </div>
      </div>

      <div class="praise-message" id="praiseMessage">YOU ARE A GENIUS! 🎉</div>
      <div class="praise-equation" id="praiseEquation">3 + 2 = 5</div>

      <!-- Floating flowers & sparkles shower decorative icons -->
      <div class="celebration-decorations">
        <span class="decor-flower flower-1">🌸</span>
        <span class="decor-flower flower-2">🌻</span>
        <span class="decor-flower flower-3">🌺</span>
        <span class="decor-flower flower-4">🌷</span>
        <span class="decor-flower flower-5">🌼</span>
      </div>

      <button id="nextQuestionBtn" class="next-btn">Next Problem ➔</button>
    </div>
  </div>

  <!-- Sad Picture / Encouraging Try Again Modal (When wrong) -->
  <div class="modal-overlay" id="sadModal">
    <div class="sad-card">
      <div class="sad-badge">Oops! Almost! 💖</div>

      <!-- Adorable Cute Sad Puppy SVG (Gentle & Encouraging) -->
      <div class="sad-picture-box">
        <svg viewBox="0 0 200 200" width="180" height="180" class="svg-sad-puppy">
          <!-- Background soft halo -->
          <circle cx="100" cy="105" r="70" fill="#E1F5FE" opacity="0.5"/>
          <!-- Droopy Sad Ears -->
          <ellipse cx="45" cy="110" rx="18" ry="42" fill="#8D6E63" transform="rotate(35 45 110)"/>
          <ellipse cx="155" cy="110" rx="18" ry="42" fill="#8D6E63" transform="rotate(-35 155 110)"/>
          <!-- Head -->
          <circle cx="100" cy="105" r="54" fill="#D7CCC8"/>
          <!-- Eye Patch -->
          <ellipse cx="80" cy="100" rx="20" ry="18" fill="#8D6E63" opacity="0.6"/>
          
          <!-- Big Teary Pleading Eyes 🥺 -->
          <!-- Left Eye -->
          <circle cx="78" cy="102" r="12" fill="#3E2723"/>
          <circle cx="75" cy="98" r="4.5" fill="#FFFFFF"/>
          <circle cx="82" cy="106" r="2.5" fill="#FFFFFF"/>
          <!-- Tear drop left -->
          <path d="M 66 110 C 64 116, 60 120, 66 124 C 72 120, 68 116, 66 110 Z" fill="#4FC3F7" class="sad-tear"/>

          <!-- Right Eye -->
          <circle cx="122" cy="102" r="12" fill="#3E2723"/>
          <circle cx="119" cy="98" r="4.5" fill="#FFFFFF"/>
          <circle cx="126" cy="106" r="2.5" fill="#FFFFFF"/>
          <!-- Tear drop right -->
          <path d="M 134 112 C 132 118, 128 122, 134 126 C 140 122, 136 118, 134 112 Z" fill="#4FC3F7" class="sad-tear"/>

          <!-- Droopy sad eyebrows -->
          <path d="M 68 88 Q 80 94 88 90" stroke="#5D4037" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M 132 88 Q 120 94 112 90" stroke="#5D4037" stroke-width="3" stroke-linecap="round" fill="none"/>

          <!-- Snout & Little Cute Sad Mouth -->
          <ellipse cx="100" cy="120" rx="16" ry="12" fill="#FFFFFF"/>
          <ellipse cx="100" cy="115" rx="8" ry="6" fill="#3E2723"/>
          <path d="M 94 128 Q 100 122 106 128" stroke="#3E2723" stroke-width="3" stroke-linecap="round" fill="none"/>

          <!-- Rosy gentle blush -->
          <circle cx="64" cy="118" r="7" fill="#FFAB91" opacity="0.6"/>
          <circle cx="136" cy="118" r="7" fill="#FFAB91" opacity="0.6"/>

          <!-- Paws holding a supportive cute heart -->
          <path d="M 100 148 C 90 135, 75 145, 85 160 L 100 175 L 115 160 C 125 145, 110 135, 100 148 Z" fill="#FF7043"/>
          <ellipse cx="78" cy="155" rx="10" ry="8" fill="#D7CCC8"/>
          <ellipse cx="122" cy="155" rx="10" ry="8" fill="#D7CCC8"/>
        </svg>
      </div>

      <div class="sad-message">Don't be sad! You can do it! 💕</div>
      <div class="sad-hint" id="sadHint">Let's count the fruit helpers together!</div>

      <div class="sad-actions">
        <button id="tryAgainBtn" class="try-again-btn">
          <span>🔄</span> Try Again!
        </button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
